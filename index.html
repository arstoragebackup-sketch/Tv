<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A.R. Plastic Surgery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #142b46 0%, #081522 45%, #03070c 100%);
    color: white;
    font-family: Arial, "Noto Sans Telugu", sans-serif;
}

/* TV LANDSCAPE */
.screen {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    padding: 5vh 6vw;
}

/* Clinic name */
.clinic {
    position: absolute;
    top: 6vh;

    font-size: clamp(28px, 3vw, 55px);
    font-weight: 700;

    letter-spacing: 6px;
}

/* Divider */
.line {
    width: 130px;
    height: 4px;

    background: #d4af37;

    margin-bottom: 5vh;
}

/* Animated content */
.content {
    display: flex;
    flex-direction: column;
    align-items: center;

    transition:
        opacity 0.7s ease,
        transform 0.7s ease;
}

.hide {
    opacity: 0;
    transform: translateY(40px) scale(0.96);
}

/* PHONE SILENT ICON */
.phone-icon {
    position: relative;

    width: clamp(80px, 7vw, 120px);
    height: clamp(140px, 12vw, 190px);

    border: 6px solid white;
    border-radius: 22px;

    margin-bottom: 4vh;

    box-shadow:
        0 0 30px rgba(255,255,255,0.12);
}

.phone-icon::before {
    content: "";

    position: absolute;

    width: 35%;
    height: 6px;

    background: white;
    border-radius: 10px;

    top: 12px;
    left: 50%;

    transform: translateX(-50%);
}

.phone-icon::after {
    content: "";

    position: absolute;

    width: 35%;
    height: 6px;

    background: white;
    border-radius: 10px;

    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);
}

/* Silent slash */
.silent-line {
    position: absolute;

    width: 150%;
    height: 7px;

    background: #d4af37;
    border-radius: 10px;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-45deg);

    box-shadow: 0 0 15px rgba(212,175,55,0.5);
}

/* Main reminder */
.title {
    font-size: clamp(50px, 6vw, 105px);

    font-weight: 800;

    line-height: 1.15;

    max-width: 1500px;
}

/* Quote */
.quote {
    margin-top: 4vh;

    font-size: clamp(24px, 2.5vw, 42px);

    color: #d4af37;

    font-style: italic;

    max-width: 1200px;

    line-height: 1.4;
}

/* Bottom */
.footer {
    position: absolute;

    bottom: 5vh;

    font-size: clamp(20px, 2vw, 32px);

    opacity: 0.75;
}

/* Mobile fallback */
@media (max-width: 900px) {

    .clinic {
        letter-spacing: 3px;
    }

    .title {
        font-size: 45px;
    }

    .quote {
        font-size: 22px;
    }

    .phone-icon {
        transform: scale(0.75);
        margin-bottom: 1vh;
    }
}
</style>
</head>

<body>

<div class="screen">

    <div class="clinic">
        A.R. PLASTIC SURGERY
    </div>

    <div class="line"></div>

    <!-- EVERYTHING ANIMATES TOGETHER -->
    <div id="content" class="content">

        <div class="phone-icon">
            <div class="silent-line"></div>
        </div>

        <div id="title" class="title">
            Please Keep Your Phone<br>
            on Silent Mode
        </div>

        <div id="quote" class="quote">
            "A little silence makes the waiting room comfortable for everyone."
        </div>

        <div id="footer" class="footer">
            Thank you for your cooperation
        </div>

    </div>

</div>

<script>

const content = document.getElementById("content");
const title = document.getElementById("title");
const quote = document.getElementById("quote");
const footer = document.getElementById("footer");

let english = true;

function changeLanguage() {

    /* Fade/slide OUT */
    content.classList.add("hide");

    setTimeout(() => {

        if (english) {

            /* TELUGU */

            title.innerHTML =
                "దయచేసి మీ ఫోన్‌ను<br>సైలెంట్ మోడ్‌లో ఉంచండి";

            quote.innerHTML =
                "“మీ నిశ్శబ్దం అందరికీ సౌకర్యవంతమైన వాతావరణాన్ని అందిస్తుంది.”";

            footer.innerHTML =
                "మీ సహకారానికి ధన్యవాదాలు";

        } else {

            /* ENGLISH */

            title.innerHTML =
                "Please Keep Your Phone<br>on Silent Mode";

            quote.innerHTML =
                "\"A little silence makes the waiting room comfortable for everyone.\"";

            footer.innerHTML =
                "Thank you for your cooperation";

        }

        english = !english;

        /* Fade/slide IN */
        content.classList.remove("hide");

    }, 700);
}

/* Change every 5 seconds */
setInterval(changeLanguage, 5000);

</script>

</body>
</html>
